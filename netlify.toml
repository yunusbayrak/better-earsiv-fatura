[build]
  publish = "public"
  command = "npm run build"

# GİB e-Arşiv Servisleri Ters Proxy Yedek Rotası (İsteğe bağlı veya doğrudan CORS kısıtlamalarında)
[[redirects]]
  from = "/gib-proxy/test/*"
  to = "https://earsivportaltest.efatura.gov.tr/earsiv-services/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/gib-proxy/prod/*"
  to = "https://earsivportal.efatura.gov.tr/earsiv-services/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
